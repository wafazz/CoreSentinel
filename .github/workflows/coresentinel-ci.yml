name: CoreSentinel CI

# Pull Request → Tests → Security → Performance → Lint → Integration → Compatibility → PASS / FAIL
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: CoreSentinel Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Unit suite (memory, governance, verification, agents, recovery, telemetry)
        run: |
          python -m pytest tests \
            --ignore=tests/integration \
            --ignore=tests/security \
            --ignore=tests/performance \
            --ignore=tests/documentation \
            --ignore=tests/demo \
            -q --junitxml=junit-unit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: junit-unit.xml

  security:
    name: Security
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Security scanner test suite
        run: python -m pytest tests/security -q

      - name: Anti-pattern & secret scan of the working tree
        run: python sentinel-validator.py

      # This printed the range and then reviewed the working tree, which is clean
      # on a checkout — a green review of nothing. --base makes the two agree.
      - name: Static review of the pull request diff
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          python coresentinel.py review --base origin/${{ github.base_ref }}

  performance:
    name: Performance Budgets
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip -r requirements-dev.txt

      # Its own stage rather than part of the unit suite: these tests are the
      # only ones whose result depends on how busy the machine is, so when one
      # fails it should be obvious that a budget was exceeded rather than that
      # a behaviour broke. Absolute limits carry 4x headroom or more; the
      # scaling ratio is hardware-independent and is the one that matters.
      - name: Published performance budgets
        run: python -m pytest tests/performance -q --junitxml=junit-performance.xml

      - name: Budgets must have a measurement behind them
        run: python coresentinel.py metrics budgets

      - name: No measured series may exceed its budget
        run: |
          python coresentinel.py context --task "CI performance probe" >/dev/null
          python coresentinel.py recall "performance" >/dev/null || true
          python coresentinel.py metrics --json > metrics.json
          python - <<'PY'
          import json, sys
          report = json.load(open('metrics.json'))['budgets']
          over = [b for b in report['budgets'] if b['status'] == 'FAIL']
          for budget in over:
              print(f"OVER BUDGET: {budget['key']} — {budget['reason']}")
          print(f"verdict={report['verdict']} passed={report['passed']} "
                f"failed={report['failed']} unmeasured={report['unknown']}")
          sys.exit(1 if over else 0)
          PY

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: junit-performance.xml

  lint:
    name: Lint
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip ruff -r requirements-dev.txt

      - name: Byte-compile every engine
        run: python -m compileall -q . -x "[.]git"

      - name: Ruff — syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 .

      # R-10's mitigation. Documentation drift is not hypothetical here: F-01
      # and F-02 were documented as working while the engine behind them
      # fabricated its numbers. A failure in this step means the docs describe
      # something that does not exist.
      - name: Documentation must describe what exists
        run: python -m pytest tests/documentation -q

      - name: Validate every JSON registry parses
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          failed = []
          for path in Path('.').glob('*.json'):
              try:
                  json.loads(path.read_text(encoding='utf-8-sig'))
              except (json.JSONDecodeError, ValueError) as exc:
                  failed.append(f"{path.name}: {exc}")
          for path in Path('memory').glob('*.json'):
              try:
                  json.loads(path.read_text(encoding='utf-8-sig'))
              except (json.JSONDecodeError, ValueError) as exc:
                  failed.append(f"memory/{path.name}: {exc}")
          if failed:
              print('Invalid JSON:', *failed, sep='\n  ')
              sys.exit(1)
          print('All JSON registries parse cleanly.')
          PY

  integration:
    name: Integration
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Integration suite
        run: python -m pytest tests/integration -q --junitxml=junit-integration.xml

      - name: CLI smoke — doctor must report a healthy Core
        run: python coresentinel.py doctor --verbose

      - name: CLI smoke — governance surfaces respond
        run: |
          python coresentinel.py status
          python coresentinel.py context
          python coresentinel.py agent list
          python coresentinel.py gate status
          python coresentinel.py adapter list

      - name: CLI smoke — JSON contracts are machine-readable
        run: |
          python coresentinel.py doctor --json | python -c "import sys,json; json.load(sys.stdin)"
          python coresentinel.py status --json | python -c "import sys,json; json.load(sys.stdin)"
          python coresentinel.py context --json | python -c "import sys,json; json.load(sys.stdin)"
          python coresentinel.py review --json | python -c "import sys,json; json.load(sys.stdin)"
          python coresentinel.py adapter export --json | python -c "import sys,json; json.load(sys.stdin)"

      # Verification is about a change, and on any checkout the change is a
      # commit range rather than a dirty tree. Reading the tree here evidenced
      # nothing and returned INDETERMINATE on every pull request; --base points
      # the evidence at the range this branch actually contributed.
      - name: Evidence-Based Verification Suite
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          python coresentinel.py verify --claim "CoreSentinel CI integration stage" \
            --base origin/${{ github.base_ref }}

      - name: Health scorecard must cite a basis for every number
        run: python coresentinel.py score --explain

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: junit-integration.xml

  compatibility:
    name: Compatibility
    needs: integration
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Full suite on ${{ matrix.os }} / Python ${{ matrix.python-version }}
        run: python -m pytest tests -q

      - name: CLI runs on this platform
        run: |
          python coresentinel.py doctor
          python coresentinel.py status

      # The demo is the only test that answers "does the product work" rather
      # than "does this subsystem work", so it runs on every OS in the matrix.
      # It governs a real project end to end, and its verification evidence
      # comes from executing that project's own pytest suite.
      - name: Reference project — governed end to end
        run: python -m pytest tests/demo -q

  gate:
    name: PASS / FAIL
    needs: [tests, security, performance, lint, integration, compatibility]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate the pipeline result
        run: |
          echo "Tests         : ${{ needs.tests.result }}"
          echo "Security      : ${{ needs.security.result }}"
          echo "Performance   : ${{ needs.performance.result }}"
          echo "Lint          : ${{ needs.lint.result }}"
          echo "Integration   : ${{ needs.integration.result }}"
          echo "Compatibility : ${{ needs.compatibility.result }}"
          echo "-----------------------------------------------"
          # Every stage is named here as well as in `needs`. Listing a job as a
          # dependency only makes the gate wait for it; this is what makes the
          # gate fail because of it.
          if [ "${{ needs.tests.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.performance.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.compatibility.result }}" != "success" ]; then
            echo "CoreSentinel CI: FAIL"
            exit 1
          fi
          echo "CoreSentinel CI: PASS"
